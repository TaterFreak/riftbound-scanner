org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 embarque un support Kotlin natif qui enregistre deja l extension
# "kotlin", en conflit avec le plugin kotlin("android") applique
# explicitement ci-dessous. On desactive ce support integre pour garder
# la chaine de plugins classique (retire dans AGP 10, a revoir alors).
android.builtInKotlin=false
